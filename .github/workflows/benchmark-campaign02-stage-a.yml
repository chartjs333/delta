name: Campaign 02 authorized Stage A exactness

on:
  workflow_call:
    inputs:
      bootstrap_artifact_run_id:
        description: Run containing the signed mapping and zero-execution registration receipt
        required: true
        type: string
      bootstrap_artifact_name:
        description: Exact artifact containing the bootstrap registration package
        required: true
        type: string
      bootstrap_artifact_run_attempt:
        description: Run attempt which emitted the registration package
        required: true
        type: number
      authority_run_id:
        description: Workflow run containing the immutable signed Stage A authority bundle
        required: true
        type: string
      authority_artifact_name:
        description: Exact artifact name containing campaign02-stage-a-authority-bundle.json
        required: true
        type: string
      authority_artifact_id:
        description: GitHub artifact ID resolved for the authority artifact
        required: true
        type: number
      authority_run_attempt:
        description: Run attempt which emitted the authority artifact
        required: true
        type: number

permissions:
  actions: read
  contents: read

concurrency:
  group: campaign-02-stage-a-${{ github.workflow_sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  authority-preflight:
    name: Verify detached Definition and Stage A authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.verify.outputs.matrix }}
    steps:
      - name: Reject non-default caller or mutable called-workflow provenance
        run: |
          test "$GITHUB_REPOSITORY" = 'chartjs333/delta'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test '${{ job.workflow_repository }}' = 'chartjs333/delta'
          test '${{ job.workflow_file_path }}' = '.github/workflows/benchmark-campaign02-stage-a.yml'
          test '${{ job.workflow_sha }}' != "$GITHUB_WORKFLOW_SHA"
          [[ '${{ inputs.authority_artifact_name }}' == *'-attempt-${{ inputs.authority_run_attempt }}' ]]
          [[ '${{ inputs.bootstrap_artifact_name }}' == *'-attempt-${{ inputs.bootstrap_artifact_run_attempt }}' ]]
      - name: Check out immutable default-branch bootstrap
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: bootstrap-root
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Check out immutable qualified source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
      - name: Download signed bootstrap mapping and registration package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.bootstrap_artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bootstrap
          run-id: ${{ inputs.bootstrap_artifact_run_id }}
      - name: Download signed authority bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.authority_artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authority
          run-id: ${{ inputs.authority_run_id }}
      - name: Materialize locked verifier environment
        working-directory: qualified-source
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.6.14
          uv sync --frozen
      - name: Verify exact bundle and expose the closed 15-plan matrix
        id: verify
        working-directory: qualified-source
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: |
          mapfile -t bootstrap_votes < <(find \
            "$RUNNER_TEMP/bootstrap/votes" -maxdepth 1 -type f -name '*.json' | sort)
          test "${#bootstrap_votes[@]}" -gt 0
          vote_args=()
          for vote in "${bootstrap_votes[@]}"; do vote_args+=(--vote "$vote"); done
          mapfile -t registration_votes < <(find \
            "$RUNNER_TEMP/bootstrap/registration-votes" -maxdepth 1 -type f -name '*.json' | sort)
          test "${#registration_votes[@]}" -eq 3
          registration_vote_args=()
          for vote in "${registration_votes[@]}"; do
            registration_vote_args+=(--registration-vote "$vote")
          done
          bootstrap_result="$(uv run python \
            specs/010-wan-benchmark-and-quality/scripts/campaign02_bootstrap_control.py \
            --mapping "$RUNNER_TEMP/bootstrap/campaign02-workflow-bootstrap-mapping.json" \
            --validator-set "$RUNNER_TEMP/bootstrap/campaign02-workflow-bootstrap-validator-set.json" \
            "${vote_args[@]}" \
            --registration "$RUNNER_TEMP/bootstrap/campaign02-workflow-registration-receipt.json" \
            --registration-api-evidence "$RUNNER_TEMP/bootstrap/campaign02-workflow-registration-api-evidence.json" \
            "${registration_vote_args[@]}" \
            --bootstrap-root "$GITHUB_WORKSPACE/bootstrap-root" \
            --qualified-source-root . \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --dispatch-ref "$GITHUB_REF" \
            --github-sha "$GITHUB_SHA")"
          test "$(jq -r '.status' <<<"$bootstrap_result")" = PASS
          test "$(jq -r '.execution_authorized' <<<"$bootstrap_result")" = false
          result="$(uv run python \
            specs/010-wan-benchmark-and-quality/scripts/campaign02_stage_a_control.py \
            verify-bundle \
            --bundle "$RUNNER_TEMP/authority/campaign02-stage-a-authority-bundle.json" \
            --source-root .)"
          test "$(jq -r '.status' <<<"$result")" = PASS
          test "$(jq '.plan_ids | length' <<<"$result")" = 15
          printf 'matrix=%s\n' "$(jq -c '.matrix' <<<"$result")" >> "$GITHUB_OUTPUT"

  native-exactness:
    name: Stage A ${{ matrix.name }} C++${{ matrix.standard }} exactness
    needs: [authority-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            compiler: g++
            standard: 20
          - name: gcc
            compiler: g++
            standard: 23
          - name: clang
            compiler: clang++
            standard: 20
          - name: clang
            compiler: clang++
            standard: 23
    steps:
      - name: Check out immutable qualified source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
      - name: Configure exact native boundary
        run: >-
          cmake -S qualified-source -B out/stage-a-native-${{ matrix.name }}-${{ matrix.standard }}
          -DBUILD_TESTING=ON -DDELTA_CXX_STANDARD=${{ matrix.standard }}
          -DDELTA_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build exact native boundaries
        run: >-
          cmake --build out/stage-a-native-${{ matrix.name }}-${{ matrix.standard }} --parallel 2
          --target delta_ffi_abi_test delta_ffi_certificates_test delta_ffi_hierarchy_test
          delta_ffi_scheduling_test delta_ffi_certificate_chain_test
          delta_ffi_certificate_chain_seed_parent_mutant_test
          delta_ffi_certificate_chain_observed_coverage_mutant_test
          delta_runtime_test delta_certificates_test
      - name: Execute native exactness and negative matrix
        run: >-
          ctest --test-dir out/stage-a-native-${{ matrix.name }}-${{ matrix.standard }}
          -R '^delta_(core\.certificates|ffi\.(abi|certificates|certificate_chain.*|hierarchy|scheduling)|runtime\.behavior)$'
          --output-on-failure
          --output-junit "$RUNNER_TEMP/native-${{ matrix.name }}-cpp${{ matrix.standard }}.xml"
      - name: Retain exact native lane
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign02-stage-a-native-${{ matrix.name }}-cpp${{ matrix.standard }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-${{ matrix.name }}-cpp${{ matrix.standard }}.xml
          if-no-files-found: error
          retention-days: 30

  java-exactness:
    name: Stage A JDK ${{ matrix.feature }} FFM exactness
    needs: [authority-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: 25
            version: 25.0.4.1
            archive_url: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz
            archive_sha256: dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e
            archive_size: 141329719
          - feature: 26
            version: 26.0.2
            archive_url: https://github.com/adoptium/temurin26-binaries/releases/download/jdk-26.0.2%2B10/OpenJDK26U-jdk_x64_linux_hotspot_26.0.2_10.tar.gz
            archive_sha256: 56f768372f6ca1e2eb4c5f46b78f627949e8dcfe9c9723926cf45a45faf35802
            archive_size: 144453933
    steps:
      - name: Check out immutable qualified source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
      - name: Provision and verify exact JDK archive
        env:
          ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
          ARCHIVE_SIZE: ${{ matrix.archive_size }}
          ARCHIVE_URL: ${{ matrix.archive_url }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/jdk.tar.gz" "$ARCHIVE_URL"
          echo "$ARCHIVE_SHA256  $RUNNER_TEMP/jdk.tar.gz" | sha256sum --check --strict
          test "$(stat --format=%s "$RUNNER_TEMP/jdk.tar.gz")" = "$ARCHIVE_SIZE"
          mkdir --parents "$RUNNER_TEMP/jdk"
          tar --extract --gzip --file "$RUNNER_TEMP/jdk.tar.gz" \
            --directory "$RUNNER_TEMP/jdk" --strip-components=1
      - name: Build exact qualified-source C ABI
        run: |
          cmake -S qualified-source -B out/stage-a-java-${{ matrix.feature }} \
            -DBUILD_TESTING=OFF -DDELTA_CXX_STANDARD=20 \
            -DDELTA_WARNINGS_AS_ERRORS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build out/stage-a-java-${{ matrix.feature }} --parallel 2 --target delta_ffi
      - name: Compile exact Java FFM and transport boundaries offline
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          mkdir --parents "$RUNNER_TEMP/java-classes"
          mapfile -t benchmark_sources < <(find \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/benchmark \
            -maxdepth 1 -type f -name '*.java' ! -name 'MeasuredStageCTransport.java' | sort)
          "$RUNNER_TEMP/jdk/bin/javac" --release '${{ matrix.feature }}' \
            -Xlint:all,-restricted -Werror \
            -d "$RUNNER_TEMP/java-classes" \
            qualified-source/delta-node-java/src/test/java/io/deltareduce/node/NativeRuntimeFfmConformance.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/hierarchy/NativeHierarchy.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/hierarchy/HierarchyRouter.java \
            qualified-source/delta-node-java/src/test/java/io/deltareduce/node/hierarchy/HierarchyConformance.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/certificates/NativeCertificateVerifier.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/certificates/AuthenticatedCertificateTransport.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/certificates/CertificateTimerService.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/apply/ArtifactEffectAdapter.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/apply/CurrentCheckpointPublisher.java \
            qualified-source/delta-node-java/src/test/java/io/deltareduce/node/certificates/CertificatesConformance.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/scheduling/NativeScheduling.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/scheduling/CapabilityCollector.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/scheduling/SchedulingTelemetry.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/scheduling/AdmissionTransport.java \
            qualified-source/delta-node-java/src/main/java/io/deltareduce/node/scheduling/LeaseTimerRouter.java \
            qualified-source/delta-node-java/src/test/java/io/deltareduce/node/scheduling/SchedulingConformance.java \
            "${benchmark_sources[@]}" \
            qualified-source/delta-node-java/src/test/java/io/deltareduce/node/benchmark/BenchmarkConformance.java
      - name: Execute exact Java FFM parity and boundary matrix
        run: |
          set -o pipefail
          "$RUNNER_TEMP/jdk/bin/java" -version 2>&1 \
            | tee "$RUNNER_TEMP/java-jdk${{ matrix.feature }}.log"
          head -n 1 "$RUNNER_TEMP/java-jdk${{ matrix.feature }}.log" | grep -F '${{ matrix.version }}'
          "$RUNNER_TEMP/jdk/bin/java" --enable-native-access=ALL-UNNAMED \
            --class-path "$RUNNER_TEMP/java-classes" \
            io.deltareduce.node.NativeRuntimeFfmConformance \
            "$GITHUB_WORKSPACE/out/stage-a-java-${{ matrix.feature }}/libdelta_ffi.so" \
            qualified-source/delta-protocol/fixtures/003/cross-language/golden-v1.json \
            "$RUNNER_TEMP/ffm-runtime-${{ matrix.feature }}" \
            2>&1 | tee --append "$RUNNER_TEMP/java-jdk${{ matrix.feature }}.log"
          "$RUNNER_TEMP/jdk/bin/java" --enable-native-access=ALL-UNNAMED \
            --class-path "$RUNNER_TEMP/java-classes" \
            io.deltareduce.node.hierarchy.HierarchyConformance \
            "$GITHUB_WORKSPACE/out/stage-a-java-${{ matrix.feature }}/libdelta_ffi.so" \
            qualified-source/delta-protocol/fixtures/006/cross-language/golden-v1.json \
            2>&1 | tee --append "$RUNNER_TEMP/java-jdk${{ matrix.feature }}.log"
          "$RUNNER_TEMP/jdk/bin/java" --enable-native-access=ALL-UNNAMED \
            --class-path "$RUNNER_TEMP/java-classes" \
            io.deltareduce.node.certificates.CertificatesConformance \
            "$GITHUB_WORKSPACE/out/stage-a-java-${{ matrix.feature }}/libdelta_ffi.so" \
            qualified-source/delta-protocol/fixtures/008/cross-language/golden-v1.json \
            2>&1 | tee --append "$RUNNER_TEMP/java-jdk${{ matrix.feature }}.log"
          "$RUNNER_TEMP/jdk/bin/java" --enable-native-access=ALL-UNNAMED \
            --class-path "$RUNNER_TEMP/java-classes" \
            io.deltareduce.node.scheduling.SchedulingConformance \
            "$GITHUB_WORKSPACE/out/stage-a-java-${{ matrix.feature }}/libdelta_ffi.so" \
            qualified-source/delta-protocol/fixtures/007/cross-language/golden-v1.json \
            2>&1 | tee --append "$RUNNER_TEMP/java-jdk${{ matrix.feature }}.log"
          "$RUNNER_TEMP/jdk/bin/java" -ea --class-path "$RUNNER_TEMP/java-classes" \
            io.deltareduce.node.benchmark.BenchmarkConformance \
            2>&1 | tee --append "$RUNNER_TEMP/java-jdk${{ matrix.feature }}.log"
      - name: Retain exact Java lane
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign02-stage-a-java-jdk${{ matrix.feature }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/java-jdk${{ matrix.feature }}.log
          if-no-files-found: error
          retention-days: 30

  cross-component-exactness:
    name: Stage A Campaign 02 cross-component exactness
    needs: [authority-preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable qualified source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
      - name: Materialize locked runtime
        working-directory: qualified-source
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.6.14
          uv sync --frozen
      - name: Run exact Campaign 02 cross-component corpus
        working-directory: qualified-source
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: >-
          uv run pytest
          delta-worker-python/tests/benchmark/test_campaign02_execution_binding.py
          delta-worker-python/tests/benchmark/test_native_chain_conformance.py
          --junitxml="$RUNNER_TEMP/python-cross-component.xml"
      - name: Retain exact cross-component lane
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign02-stage-a-cross-component-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python-cross-component.xml
          if-no-files-found: error
          retention-days: 30

  exactness-plan:
    name: Stage A authorized plan ${{ matrix.item.ordinal }}
    needs: [authority-preflight, native-exactness, java-exactness, cross-component-exactness]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.authority-preflight.outputs.matrix) }}
    steps:
      - name: Check out immutable qualified source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
      - name: Download signed authority bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.authority_artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authority
          run-id: ${{ inputs.authority_run_id }}
      - name: Download native exactness lane evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/exactness
          pattern: campaign02-stage-a-native-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Download Java exactness lane evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/exactness
          pattern: campaign02-stage-a-java-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Download cross-component exactness lane evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: campaign02-stage-a-cross-component-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exactness
      - name: Materialize locked runtime
        working-directory: qualified-source
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.6.14
          uv sync --frozen
      - name: Emit one authorized source-bound plan record
        working-directory: qualified-source
        env:
          PLAN_ID: ${{ matrix.item.plan_id }}
        run: >-
          uv run python
          specs/010-wan-benchmark-and-quality/scripts/campaign02_stage_a_control.py
          emit-plan-evidence
          --bundle "$RUNNER_TEMP/authority/campaign02-stage-a-authority-bundle.json"
          --source-root .
          --plan-id "$PLAN_ID"
          --evidence-dir "$RUNNER_TEMP/exactness"
          --output "$RUNNER_TEMP/stage-a-plan-${{ matrix.item.ordinal }}.json"
      - name: Retain immutable plan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign02-stage-a-plan-${{ matrix.item.ordinal }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-a-plan-${{ matrix.item.ordinal }}.json
          if-no-files-found: error
          retention-days: 30

  stage-a-gate:
    name: Emit typed Stage A gate receipt
    needs: [authority-preflight, exactness-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable default-branch bootstrap
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: bootstrap-root
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Check out immutable qualified source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ job.workflow_sha }}
      - name: Download signed bootstrap mapping and registration package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.bootstrap_artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bootstrap
          run-id: ${{ inputs.bootstrap_artifact_run_id }}
      - name: Download signed authority bundle
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ inputs.authority_artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authority
          run-id: ${{ inputs.authority_run_id }}
      - name: Download all 15 create-only plan records
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/stage-a-plans
          pattern: campaign02-stage-a-plan-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Download native exactness lane evidence for semantic re-verification
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/exactness
          pattern: campaign02-stage-a-native-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Download Java exactness lane evidence for semantic re-verification
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          merge-multiple: true
          path: ${{ runner.temp }}/exactness
          pattern: campaign02-stage-a-java-*-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Download cross-component evidence for semantic re-verification
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: campaign02-stage-a-cross-component-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exactness
      - name: Materialize locked verifier environment
        working-directory: qualified-source
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.6.14
          uv sync --frozen
      - name: Close exact plan set and emit canonical receipt
        working-directory: qualified-source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          finalized_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          current_artifacts="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          authority_artifacts="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.authority_run_id }}/artifacts?per_page=100")"
          bootstrap_artifacts="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.bootstrap_artifact_run_id }}/artifacts?per_page=100")"
          authority_run_attempt="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.authority_run_id }}" \
            --jq '.run_attempt')"
          bootstrap_run_attempt="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.bootstrap_artifact_run_id }}" \
            --jq '.run_attempt')"
          test "$authority_run_attempt" = '${{ inputs.authority_run_attempt }}'
          test "$bootstrap_run_attempt" = '${{ inputs.bootstrap_artifact_run_attempt }}'
          artifact_id() {
            local document="$1" name="$2"
            jq -er --arg name "$name" \
              '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0].id else error("artifact identity ambiguous") end' \
              <<<"$document"
          }
          artifact_digest() {
            local document="$1" name="$2"
            jq -er --arg name "$name" \
              '[.artifacts[] | select(.name == $name)] | if length == 1 then .[0].digest else error("artifact digest ambiguous") end | select(test("^sha256:[0-9a-f]{64}$"))' \
              <<<"$document"
          }
          authority_id="$(artifact_id "$authority_artifacts" '${{ inputs.authority_artifact_name }}')"
          test "$authority_id" = '${{ inputs.authority_artifact_id }}'
          bootstrap_id="$(artifact_id "$bootstrap_artifacts" '${{ inputs.bootstrap_artifact_name }}')"
          input_id_args=(
            --input-artifact-id
            "authority/campaign02-stage-a-authority-bundle.json=$authority_id"
          )
          input_digest_args=(
            --input-artifact-digest
            "authority/campaign02-stage-a-authority-bundle.json=$(artifact_digest "$authority_artifacts" '${{ inputs.authority_artifact_name }}')"
          )
          for path in "$RUNNER_TEMP"/exactness/*; do
            filename="$(basename "$path")"
            case "$filename" in
              native-*-cpp*.xml)
                stem="${filename#native-}"
                stem="${stem%.xml}"
                artifact_name="campaign02-stage-a-native-$stem-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
                ;;
              java-jdk*.log)
                stem="${filename#java-}"
                stem="${stem%.log}"
                artifact_name="campaign02-stage-a-java-$stem-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
                ;;
              python-cross-component.xml)
                artifact_name="campaign02-stage-a-cross-component-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
                ;;
              *) exit 1 ;;
            esac
            input_id_args+=(
              --input-artifact-id
              "raw/$filename=$(artifact_id "$current_artifacts" "$artifact_name")"
            )
            input_digest_args+=(
              --input-artifact-digest
              "raw/$filename=$(artifact_digest "$current_artifacts" "$artifact_name")"
            )
          done
          while IFS= read -r -d '' path; do
            relative="${path#"$RUNNER_TEMP/bootstrap/"}"
            input_id_args+=(--input-artifact-id "bootstrap/$relative=$bootstrap_id")
            input_digest_args+=(
              --input-artifact-digest
              "bootstrap/$relative=$(artifact_digest "$bootstrap_artifacts" '${{ inputs.bootstrap_artifact_name }}')"
            )
          done < <(find "$RUNNER_TEMP/bootstrap" -type f -print0 | sort -z)
          output_id_args=()
          output_digest_args=()
          for path in "$RUNNER_TEMP"/stage-a-plans/*.json; do
            filename="$(basename "$path")"
            ordinal="${filename#stage-a-plan-}"
            ordinal="${ordinal%.json}"
            artifact_name="campaign02-stage-a-plan-$ordinal-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
            output_id_args+=(
              --output-artifact-id
              "plans/$filename=$(artifact_id "$current_artifacts" "$artifact_name")"
            )
            output_digest_args+=(
              --output-artifact-digest
              "plans/$filename=$(artifact_digest "$current_artifacts" "$artifact_name")"
            )
          done
          mapfile -t bootstrap_votes < <(find \
            "$RUNNER_TEMP/bootstrap/votes" -maxdepth 1 -type f -name '*.json' | sort)
          vote_args=()
          for vote in "${bootstrap_votes[@]}"; do vote_args+=(--bootstrap-vote "$vote"); done
          mapfile -t registration_votes < <(find \
            "$RUNNER_TEMP/bootstrap/registration-votes" -maxdepth 1 -type f -name '*.json' | sort)
          test "${#registration_votes[@]}" -eq 3
          registration_vote_args=()
          for vote in "${registration_votes[@]}"; do
            registration_vote_args+=(--registration-vote "$vote")
          done
          bootstrap_path="$(jq -r '.bootstrap_workflow_path' \
            "$RUNNER_TEMP/bootstrap/campaign02-workflow-bootstrap-mapping.json")"
          bootstrap_blob_id="$(git -C "$GITHUB_WORKSPACE/bootstrap-root" rev-parse \
            "$GITHUB_WORKFLOW_SHA:$bootstrap_path")"
          bootstrap_content_id="$(python3 -c \
            'import hashlib,sys; print("sha256:"+hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest())' \
            "$GITHUB_WORKSPACE/bootstrap-root/$bootstrap_path")"
          uv run python \
            specs/010-wan-benchmark-and-quality/scripts/campaign02_stage_a_control.py \
            finalize \
            --bundle "$RUNNER_TEMP/authority/campaign02-stage-a-authority-bundle.json" \
            --source-root . \
            --evidence-dir "$RUNNER_TEMP/stage-a-plans" \
            --raw-evidence-dir "$RUNNER_TEMP/exactness" \
            --bootstrap-root "$RUNNER_TEMP/bootstrap" \
            --bootstrap-mapping "$RUNNER_TEMP/bootstrap/campaign02-workflow-bootstrap-mapping.json" \
            --bootstrap-validator-set "$RUNNER_TEMP/bootstrap/campaign02-workflow-bootstrap-validator-set.json" \
            "${vote_args[@]}" \
            --registration-receipt "$RUNNER_TEMP/bootstrap/campaign02-workflow-registration-receipt.json" \
            --registration-api-evidence "$RUNNER_TEMP/bootstrap/campaign02-workflow-registration-api-evidence.json" \
            "${registration_vote_args[@]}" \
            --workflow-run-id '${{ github.run_id }}' \
            --workflow-run-attempt '${{ github.run_attempt }}' \
            --workflow-repository '${{ github.repository }}' \
            --workflow-sha '${{ github.workflow_sha }}' \
            --workflow-blob-id "$bootstrap_blob_id" \
            --workflow-content-id "$bootstrap_content_id" \
            --workflow-ref '${{ github.workflow_ref }}' \
            --dispatch-ref '${{ github.ref }}' \
            --event-name '${{ github.event_name }}' \
            --github-sha '${{ github.sha }}' \
            "${input_id_args[@]}" \
            "${input_digest_args[@]}" \
            "${output_id_args[@]}" \
            "${output_digest_args[@]}" \
            --authority-artifact-run-id '${{ inputs.authority_run_id }}' \
            --authority-artifact-run-attempt '${{ inputs.authority_run_attempt }}' \
            --bootstrap-artifact-run-id '${{ inputs.bootstrap_artifact_run_id }}' \
            --bootstrap-artifact-run-attempt '${{ inputs.bootstrap_artifact_run_attempt }}' \
            --finalized-at "$finalized_at" \
            --output-gate-qc "$RUNNER_TEMP/stage-a-workflow-gate-qc.json" \
            --output-receipt "$RUNNER_TEMP/stage-a-gate-receipt.json"
      - name: Retain typed receipt and gate QC
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign02-stage-a-gate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage-a-workflow-gate-qc.json
            ${{ runner.temp }}/stage-a-gate-receipt.json
          if-no-files-found: error
          retention-days: 30
