name: Python worker quality

on:
  push:
    branches: [001-reproducible-training-baseline, 002-local-round-engine, 003-bft-round-state-machine]
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind canonical main ref for pull requests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git update-ref refs/remotes/origin/main "$PR_BASE_SHA"
          fi

      - name: Install pinned workspace tool
        run: python3 -m pip install --disable-pip-version-check uv==0.6.14

      - name: Materialize locked environment
        run: uv sync --frozen

      - name: Verify merged formal prerequisite
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: |
          uv run python specs/001-reproducible-training-baseline/scripts/verify_formal_prerequisite.py --check-only
          uv run python -m unittest discover -s specs/001-reproducible-training-baseline/tests -v

      - name: Run offline Python and protocol gates
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy delta-worker-python/src
          uv run pytest delta-worker-python/tests

      - name: Reproduce feature 001 foundation evidence on its branch
        if: ${{ github.ref_name == '001-reproducible-training-baseline' || github.head_ref == '001-reproducible-training-baseline' }}
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: uv run python specs/001-reproducible-training-baseline/scripts/verify_foundation.py --check-only

      - name: Reproduce feature 002 compatibility on its branch
        if: ${{ github.ref_name == '002-local-round-engine' || github.head_ref == '002-local-round-engine' }}
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: |
          uv run python specs/002-local-round-engine/scripts/verify_predecessor.py --check-only
          uv run python specs/002-local-round-engine/scripts/verify_final_compatibility.py --check-only

      - name: Verify feature 003 prerequisite and contract evidence
        if: ${{ github.ref_name == '003-bft-round-state-machine' || github.head_ref == '003-bft-round-state-machine' }}
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: |
          uv run python specs/003-bft-round-state-machine/scripts/verify_preflight.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_native_toolchains.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_protocol_contracts.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_core_architecture.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_native_supply_chain.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_toolchain_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_core_protocol_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_core_arithmetic_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_core_transition_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_core_consensus_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_core_portability_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_prepared_100_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_runtime_durability_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_abi_ffm_execution.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_native_refinement.py --check-only
          uv run python specs/003-bft-round-state-machine/scripts/verify_native_phase6_execution.py --check-only
          uv run pytest specs/003-bft-round-state-machine/tests
