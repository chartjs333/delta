name: Campaign 02 concentrated-loss candidate-binding qualification

on:
  pull_request:
    branches: [010-wan-benchmark-and-quality]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-02-concentrated-loss-candidate-binding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-source:
    name: Executable provenance portable exact-source corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out qualification overlay
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Resolve immutable remediation source
        id: source
        shell: bash
        run: |
          evidence='control/specs/010-wan-benchmark-and-quality/evidence/campaign-02-concentrated-loss-candidate-binding-hardware-qualification.json'
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source"]["commit"])' "$evidence")"
          git -C control cat-file -e "${source_commit}^{commit}"
          git -C control merge-base --is-ancestor c9a2da487eb6637200e45dbbd56d84b30704d38e "$source_commit"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
      - name: Check out immutable remediation source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ steps.source.outputs.commit }}
      - name: Materialize locked portable environment
        working-directory: qualified-source
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.6.14
          uv sync --frozen
      - name: Run C2-034 through C2-048 portable corpus
        working-directory: qualified-source
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy delta-worker-python/src
          uv run pytest \
            delta-worker-python/tests/benchmark/test_campaign02_bootstrap.py \
            delta-worker-python/tests/benchmark/test_campaign02_execution_binding.py \
            delta-worker-python/tests/benchmark/test_campaign02_governance_signatures.py \
            delta-worker-python/tests/benchmark/test_campaign02_remediation.py \
            delta-worker-python/tests/benchmark/test_campaign02_run_level_finalization.py \
            delta-worker-python/tests/benchmark/test_campaign02_stage_c_candidate.py \
            delta-worker-python/tests/benchmark/test_campaign02_stage_c_runtime.py \
            delta-worker-python/tests/benchmark/test_native_chain_conformance.py \
            specs/010-wan-benchmark-and-quality/tests/test_campaign02_contracts.py \
            specs/010-wan-benchmark-and-quality/tests/test_campaign02_runner_definition.py \
            --junitxml="$RUNNER_TEMP/campaign-02-concentrated-loss-candidate-binding-portable.xml"
      - name: Retain portable corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-02-concentrated-loss-candidate-binding-portable-${{ github.run_id }}
          path: ${{ runner.temp }}/campaign-02-concentrated-loss-candidate-binding-portable.xml
          if-no-files-found: error
          retention-days: 30

  tsan-source:
    name: Executable provenance exact-source TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out qualification overlay
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          path: control
          persist-credentials: false
      - name: Resolve immutable remediation source
        id: source
        shell: bash
        run: |
          evidence='control/specs/010-wan-benchmark-and-quality/evidence/campaign-02-concentrated-loss-candidate-binding-hardware-qualification.json'
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source"]["commit"])' "$evidence")"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
      - name: Check out immutable remediation source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          path: qualified-source
          persist-credentials: false
          ref: ${{ steps.source.outputs.commit }}
      - name: Configure dedicated GCC TSan build
        working-directory: qualified-source
        run: >-
          cmake -S . -B out/build/campaign02-runner-provenance-tsan
          -DBUILD_TESTING=ON -DDELTA_CXX_STANDARD=20 -DDELTA_WARNINGS_AS_ERRORS=ON
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -fno-sanitize-recover=all"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -fno-sanitize-recover=all"
      - name: Build and execute concurrent boundaries
        working-directory: qualified-source
        run: |
          cmake --build out/build/campaign02-runner-provenance-tsan --parallel 2 \
            --target delta_runtime_benchmark_test delta_runtime_test delta_certificates_test
          ctest --test-dir out/build/campaign02-runner-provenance-tsan \
            -R 'delta_(runtime\.benchmark|runtime\.behavior|core\.certificates)' \
            --output-on-failure 2>&1 | tee "$RUNNER_TEMP/campaign-02-runner-provenance-tsan.log"
      - name: Retain TSan result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-02-concentrated-loss-candidate-binding-tsan-${{ github.run_id }}
          path: ${{ runner.temp }}/campaign-02-runner-provenance-tsan.log
          if-no-files-found: error
          retention-days: 30

  exact-source-admission:
    name: Join portable, TSan and designated-GPU provenance evidence
    needs: [portable-source, tsan-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out qualification overlay
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: control
          persist-credentials: false
      - name: Resolve immutable remediation source
        id: source
        shell: bash
        run: |
          evidence='control/specs/010-wan-benchmark-and-quality/evidence/campaign-02-concentrated-loss-candidate-binding-hardware-qualification.json'
          source_commit="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source"]["commit"])' "$evidence")"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"
      - name: Check out immutable remediation source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          path: qualified-source
          persist-credentials: false
          ref: ${{ steps.source.outputs.commit }}
      - name: Download exact-source portable corpus
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: campaign-02-concentrated-loss-candidate-binding-portable-${{ github.run_id }}
          path: ${{ runner.temp }}/portable
      - name: Install locked verifier environment
        working-directory: qualified-source
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.6.14
          uv sync --frozen
      - name: Reproduce exact source report
        working-directory: qualified-source
        env:
          ALL_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
          UV_OFFLINE: "true"
        run: |
          uv run python \
            specs/010-wan-benchmark-and-quality/scripts/verify_campaign02_runner_provenance_source.py \
            --source-commit '${{ steps.source.outputs.commit }}' \
            --portable-junit "$RUNNER_TEMP/portable/campaign-02-concentrated-loss-candidate-binding-portable.xml" \
            --hardware-evidence "$GITHUB_WORKSPACE/control/specs/010-wan-benchmark-and-quality/evidence/campaign-02-concentrated-loss-candidate-binding-hardware-qualification.json" \
            --output "$RUNNER_TEMP/campaign-02-concentrated-loss-candidate-binding-exact-source-qualification.json"
          cmp \
            "$RUNNER_TEMP/campaign-02-concentrated-loss-candidate-binding-exact-source-qualification.json" \
            "$GITHUB_WORKSPACE/control/specs/010-wan-benchmark-and-quality/evidence/campaign-02-concentrated-loss-candidate-binding-exact-source-qualification.json"
      - name: Retain exact-source qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-02-concentrated-loss-candidate-binding-source-${{ github.run_id }}
          path: ${{ runner.temp }}/campaign-02-concentrated-loss-candidate-binding-exact-source-qualification.json
          if-no-files-found: error
          retention-days: 30
