    Validators = {v1, v2, v3, v4}
    InitialByzantine = {v4}
    Heights = {h1}
    ValidatorEpochs = {epoch1}
    ConfigBodies = {configA}
    Workers = {w1, w2, w3}
    Tickets = {t1, t2, t3}
    Domains = {d1, d2}
    DataRanges = {data1, data2, data3}
    BatchBudgets = {1}
    StepBudgets = {1}
    ParentCheckpoints = {parent1}
    ParameterSchemas = {schema1}
    ArithmeticProfiles = {profile1}
    StoragePeers = {s1, s2, s3}
    Shards = {shard1, shard2}
    ContentIds = {content1, content2, content3}
    CompletedTickets = {t1, t2, t3}
    RequiredTickets = {t1, t2, t3}
    ConfiguredClosePolicy = "OMIT_UNAVAILABLE"
    SeedValues = {seed1}
    ExpectedSeedValue = seed1
    NormEvidenceValues = {norm1}
    ValidNormEvidence = {norm1}
    CoefficientProfiles = {coeff1}
    ConfiguredCoefficientProfile = coeff1
    SafeCoefficientProfiles = {coeff1}
    ParameterValues = {0}
    AccumulatorBound = 1
    ExpectedParameterValue = 0
