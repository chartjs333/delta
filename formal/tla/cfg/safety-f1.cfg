SPECIFICATION F1Spec

\* Mandatory non-trivial quorum composition: 3f+1 = 4 validators, three
\* tickets, two domains and two parameter shards.  The reduced action surface
\* focuses TLC on quorum, view-change and immutable hard-abort interleavings.
