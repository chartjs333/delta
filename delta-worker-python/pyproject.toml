[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deltatorrent-worker"
version = "0.1.0"
description = "DeltaReduce worker-local reproducible scientific baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=46.0.3,<47",
  "numpy>=2.1,<3",
  "safetensors>=0.5,<1",
  "torch==2.6.0",
]

[project.scripts]
delta = "deltatorrent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deltatorrent"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
